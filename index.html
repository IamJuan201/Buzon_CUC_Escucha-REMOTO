<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón CUC Escucha</title>
    <link rel="stylesheet" href="/css/app.css">
</head>

<body>
    <div class="pagina">
        <div class="tarjeta">
    
        <div class="encabezado">
            <h1>Buzón de sugerencias</h1>
            <p>Tu opinión nos ayuda a mejorar. Completa el formulario y nos pondremos en contacto si lo necesitas.</p>
        </div>
    
        <form class="cuerpo">
            <div class="fila">
            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">
            </div>
    
            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
            </div>
            </div>
    
            <div class="fila">
            <div class="campo">
                <label for="categoria">Categoría</label>
                <select id="categoria" name="categoria">
                <option value="sugerencia">Sugerencia</option>
                <option value="queja">Queja</option>
                <option value="felicitacion">Felicitación</option>
                <option value="otro">Otro</option>
                </select>
            </div>
    
            <div class="campo">
                <label for="asunto">Asunto</label>
                <input type="text" id="asunto" name="asunto" placeholder="Un título breve">
            </div>
            </div>
    
            <div class="campo campo-completo">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí" required></textarea>
            </div>
    
            <div class="checkbox">
            <input type="checkbox" id="anonimo" name="anonimo">
            <label for="anonimo">Prefiero enviarlo de forma anónima</label>
            </div>
    
            <button type="submit">Enviar mensaje</button>
        </form>
    
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>

</html>
